services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
    environment:
      - CROWNAI_DB_PATH=/app/data/crownai.db
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID}
      - MICROSOFT_REDIRECT_URI=${MICROSOFT_REDIRECT_URI}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - OAUTH_DEV_MOCK=${OAUTH_DEV_MOCK:-true}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* vars are inlined into the browser bundle at build
        # time, so this must be a URL the user's BROWSER can reach -- not
        # the backend's compose-network service name ("backend"), which
        # only resolves inside the compose network, never from the host
        # browser. The backend's port is published to the host as 8000, so
        # 127.0.0.1:8000 is reachable from the browser on the same machine
        # (127.0.0.1 rather than localhost avoids an IPv6 ::1 lookup miss).
        - NEXT_PUBLIC_API_BASE=http://127.0.0.1:8000
    ports:
      - "3000:3000"
    environment:
      # Runtime value for server-side code inside the compose network. The
      # browser bundle keeps the build-arg URL above (inlined at build time).
      - NEXT_PUBLIC_API_BASE=http://backend:8000
      # Server-side rendering (e.g. /pricing) runs inside the compose
      # network, where the backend is reachable by its service name.
      - API_BASE_INTERNAL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
